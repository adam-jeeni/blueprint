[project]
name = "blueprint"
version = "0.1.0"
description = "CLI tool for the convention-over-configuration AI-human development methodology"
requires-python = ">=3.12"
readme = "METHODOLOGY.md"
license = { text = "MIT" }

[project.scripts]
blueprint = "ai_project.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
